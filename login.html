<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apni-Dukaan</title>
  <link rel="stylesheet" type="text/css" href="./static/login.css">
  <script src="./static/login.js"></script>
  <link rel="icon" href="./Images/favicon.ico" type="image/x-icon">     
</head>    
<body>
  <div class="login_form">
    <div class="details">
      <div class="welcome">Apni Dukaan</div>
      <form>
        <div class="wrap">
          <label>Email</label>
          <input type="text" class="input" id="email">
        </div>
        <div class="wrap">
          <label>Password</label>
          <input type="password" class="input" data-type="password" id="pwd1">
        </div>
        <div class="wrap">
          <a href="forgotPassword.html" title="Forgot Password" id="link-reset">Forgot Password?</a>
        </div>
        <button class="button" value="Login" onclick="return login()">
          <h1 class="sign">Sign in!</h1>
        </button>
      </form>
    </div>
    <a href="./index.html"><img class="fox" src="Images/Logo/ApniDukan.png" /></a>
    <div class="details-two">
      <h1 class="back">Welcome back!</h1>
      <p class="log">Log in and use the opportunities offered by our portal.</p>
      <h2 class="acc">You don't have an account?</h2>
      <button class="signup" onclick="redirectToSignup()"><h3>SignUp!</h3></button>
    </div>
  </div>

  <!-- ✅ Popup Modal -->
  <div id="popup" class="popup" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div class="popup-content" style="background: #fff; padding: 20px; border-radius: 10px; text-align: center; position: relative; min-width: 250px; max-width: 400px;">
      <span id="popup-close" class="popup-close" style="position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 18px;">&times;</span>
      <p id="popup-message"></p>
    </div>
  </div>

  <script src="./static/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
