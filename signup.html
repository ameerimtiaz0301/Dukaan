<!DOCTYPE html>
<html>
<head>
  <title>Apni Dukaan - Signup</title>
  <link rel="stylesheet" href="./static/signup.css">
  <link rel="icon" href="./Images/favicon.ico" type="image/x-icon">
  <style>
    /* quick loading spinner */
    .loading {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      color: #333;
    }
    .loading::after {
      content: "⏳";
      display: inline-block;
      margin-left: 6px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Popup backdrop */
    .popup {
      display: none; /* start hidden */
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }


    /* Popup box */
    .popup-content {
      background: #fff;
      padding: 25px 35px;
      border-radius: 12px;
      text-align: center;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease-in-out;
      font-family: Arial, sans-serif;
      position: relative;
    }

    .popup-content p {
      font-size: 16px;
      margin: 0;
      color: #333;
    }

    /* Close button */
    .popup-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: #888;
    }

    .popup-close:hover {
      color: #000;
    }

    /* Success & Error colors */
    .popup.success .popup-content {
      border-left: 6px solid #4CAF50;
    }
    .popup.error .popup-content {
      border-left: 6px solid #F44336;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <section>
    <div class="box">
      <div class="form">
        <div class="form_logo"><img src="Images/Logo/ApniDukan.png"></div>
        <h2>SignUp</h2>
        
        <form id="signupForm">
          <div class="inputBox">
            <input type="text" id="username" placeholder="Username" required 
              pattern="[a-zA-Z0-9]+" title="Only AlphaNumeric Characters Allowed">
            <img src="./Images/user.png">
          </div>
          <div class="inputBox">
            <input type="text" id="email" placeholder="Email Id" required 
              pattern="[a-z0-9._%+\-]+@[a-z0-9.-]+\.[a-z]{2,}$">
            <img src="./Images/user.png">
          </div>
          <div class="inputBox">
            <input type="password" id="password" placeholder="Password" required 
              pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*#?&]).{8,16}"
              title="Must contain at least one number, one uppercase letter, one lowercase letter, one special character, and length should be minimum 8 and maximum 16 characters">
            <img src="./Images/lock.png">
          </div>
          <label class="remember"><input type="checkbox"> Remember Me</label>
          <div class="inputBox">
            <input class="btn" type="submit" value="SignUp">
          </div>
          <!-- 🔄 Loading message -->
          <div id="loading" class="loading">Signing up...</div>
        </form>

        <p>Have an <a href="login.html">Account</a>?</p>
      </div>
    </div>
  </section>

  <!-- Popup Modal -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <span id="popup-close" class="popup-close">&times;</span>
      <p id="popup-message"></p>
    </div>
  </div>

  <script src="./static/signup.js"></script>
</body>
</html>
